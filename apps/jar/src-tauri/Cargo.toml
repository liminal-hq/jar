[package]
name = "jar"
version = "0.2.0"
description = "A tiny floating desktop aquarium"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
name = "jar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Stores the save/settings snapshot beside the executable instead of the OS
# app-data directory, for the no-install Windows distribution.
portable = ["tauri-plugin-jar/portable"]

[dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-jar = { path = "../../../plugins/tauri-plugin-jar" }
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
# Debug-only automation bridge (see `run()` in `src/lib.rs` — only
# registered under `#[cfg(debug_assertions)]`), lets an agent drive and
# screenshot the running app during development. Not a dev-dependency:
# `[dev-dependencies]` aren't available to the main lib/bin target, only to
# tests/examples/benches, so it has to be a normal dependency even though
# it's only ever activated in debug builds.
tauri-plugin-mcp-bridge = "0.13"
serde = { workspace = true }
serde_json = "1"
