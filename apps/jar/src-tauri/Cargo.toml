[package]
name = "jar"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "jar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-jar = { path = "../../../plugins/tauri-plugin-jar" }
tauri-plugin-window-state = "2"
tauri-plugin-os = "2"
serde = { workspace = true }
serde_json = "1"
