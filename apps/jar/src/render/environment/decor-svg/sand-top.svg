<svg xmlns="http://www.w3.org/2000/svg" viewBox="-300 -150 600 300">
  <!-- Jar sand-floor overlay, top-down. `sand-top` is a wide, asymmetric
       lobed patch (never a plain oval) laid over the darker base box;
       `rock` is one larger stone (§8.1's "one rock", stationed near the
       airstone per that section's own note); `pebbles` are several smaller
       stones of varied size scattered across the sand, so the floor reads
       as textured/blended rather than two flat colour bands. Fills are
       placeholders: colour is applied at runtime via material. -->
  <path id="sand-top" fill="#d8c9a0" d="
    M -216 -52
    C -224 -76, -192 -90, -166 -82
    C -154 -98, -122 -98, -108 -84
    C -82 -96, -44 -90, -30 -76
    C -4 -84, 32 -78, 41 -60
    C 67 -68, 93 -50, 84 -32
    C 103 -21, 94 2, 71 4
    C 64 21, 33 26, 15 15
    C -5 28, -40 23, -48 6
    C -68 4, -75 -13, -66 -28
    C -94 -26, -101 -9, -92 5
    C -120 14, -153 6, -161 -12
    C -191 -8, -220 -24, -216 -52
    Z"/>

  <!-- One larger stone — noticeably bigger than any pebble below, an
       irregular (not round) silhouette so it doesn't read as an oversized
       pebble. Stationed toward the airstone side of the floor, per §8.1's
       own "near the rock" note on the airstone's position. -->
  <path id="rock" fill="#8a7860" d="
    M 92 30
    C 78 22, 76 2, 90 -10
    C 96 -26, 118 -30, 132 -20
    C 148 -24, 164 -10, 160 6
    C 172 16, 166 34, 150 36
    C 144 48, 122 50, 112 40
    C 100 44, 90 38, 92 30
    Z"/>

  <!-- Several stones, plain circles at varied radii/positions so they're
       trivial to scatter without hand-authoring a dozen organic blobs —
       small enough to read as pebbles, not a second rock. -->
  <path id="pebbles" fill="#a9906f" d="
    M -173 96 A 15 15 0 0 1 -143 96 A 15 15 0 0 1 -173 96 Z
    M 45 90 A 10 10 0 0 1 65 90 A 10 10 0 0 1 45 90 Z
    M -60 -60 A 8 8 0 0 1 -44 -60 A 8 8 0 0 1 -60 -60 Z
    M 180 70 A 12 12 0 0 1 204 70 A 12 12 0 0 1 180 70 Z
    M -110 60 A 7 7 0 0 1 -96 60 A 7 7 0 0 1 -110 60 Z
    M 10 -40 A 9 9 0 0 1 28 -40 A 9 9 0 0 1 10 -40 Z
    M 130 -30 A 6 6 0 0 1 142 -30 A 6 6 0 0 1 130 -30 Z
    M -30 80 A 11 11 0 0 1 -8 80 A 11 11 0 0 1 -30 80 Z"/>
</svg>
