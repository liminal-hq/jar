<svg xmlns="http://www.w3.org/2000/svg" viewBox="-170 -110 340 220">
  <!-- Jar fish body. Faces +X, nose at (100,0), tail pivot at (-60,0).
       Fills are placeholders: hue is applied at runtime via material.color.setHSL(). -->
  <path id="body-back" fill="#6fa8dc" d="
    M 100 0
    C 100 -32, 58 -44, 10 -44
    C -26 -44, -50 -20, -60 -12
    C -65 -8, -67 -5, -67 0
    C -67 5, -65 8, -60 12
    C -50 22, -26 46, 15 46
    C 48 46, 76 32, 88 18
    C 96 12, 100 8, 100 0
    Z"/>
  <path id="body-belly" fill="#cfe6f5" d="
    M 88 16
    C 64 26, 36 30, 8 28
    C -22 26, -46 18, -60 12
    C -50 22, -26 46, 15 46
    C 48 46, 76 32, 88 18
    Z"/>
  <circle id="eye" fill="#22222a" cx="68" cy="-10" r="7"/>
  <!-- `Banded` pattern gene (issue #98's follow-up): 3 vertical body-band
       decals, tapered-lens shapes (echoing gill.svg's own curve-only
       authoring), spaced along the body so they clear the eye/mouth/gill
       area (x > ~35). Sized to stay inside body-back's own silhouette at
       each x — verified against that path's control points, not just eyeballed.
       Mounted/mirrored exactly like gill.svg (FishModel.tsx), but — unlike
       the rigid gill — ride the swim wave via their own material
       (attachSwimWaveVertexShader/attachSwimWaveDepthMaterial), since a band
       spans a range of body x rather than sitting at one fixed point.
       Placeholder fill; runtime colour is a darkened tint of the fish's hue. -->
  <path id="band-1" fill="#4a4a55" d="
    M -30 -16
    C -33.6 -9.6 -36 -8 -36 0
    C -36 8 -33.6 9.6 -30 16
    C -26.4 9.6 -24 8 -24 0
    C -24 -8 -26.4 -9.6 -30 -16
    Z"/>
  <path id="band-2" fill="#4a4a55" d="
    M 0 -30
    C -4.2 -18 -7 -15 -7 0
    C -7 15 -4.2 18 0 30
    C 4.2 18 7 15 7 0
    C 7 -15 4.2 -18 0 -30
    Z"/>
  <path id="band-3" fill="#4a4a55" d="
    M 30 -26
    C 25.8 -15.6 23 -13 23 0
    C 23 13 25.8 15.6 30 26
    C 34.2 15.6 37 13 37 0
    C 37 -13 34.2 -15.6 30 -26
    Z"/>
</svg>
