<svg xmlns="http://www.w3.org/2000/svg" viewBox="-170 -110 340 220">
  <!-- Ramshorn shell: flat planispiral disc carried upright; bigger across
       than the coil but thin (3D: ~half the coil's extrusion depth). Concentric
       ring whorl (shell-ring-outer/-inner + shell-core) is always shown, the way
       body-belly rides on body.svg. shell-band/shell-spot-* are the Pattern-gene
       decal paths, gene-toggled by id at load time: Banded shows shell-band,
       Spotted shows shell-spot-1..4, Solid shows neither. Base flattened onto
       y=40. Sealed pose (issue #98): shell drops 30 units so its base (y=40)
       rests on the contact line (y=70); aperture fit c(8,20) r 8x10 rot -45deg;
       operculum extrudes at shell depth - 6. Placeholder fills. -->
  <path id="shell" fill="#c97b4a" d="M 30 -12 C 30 -42, 6 -66, -24 -66 C -54 -66, -78 -42, -78 -12 C -78 14, -64 32, -46 39 C -32 41, -10 41, 2 38 C 20 32, 30 12, 30 -12 Z"/>
