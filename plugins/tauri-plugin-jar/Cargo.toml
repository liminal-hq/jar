[package]
name = "tauri-plugin-jar"
version = "0.2.1"
description = "Native adapter running jar-core's simulation loop in the Jar desktop app — background tick loop, event push, autosave"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
links = "tauri-plugin-jar"

[features]
# Stores the save/settings snapshot beside the executable instead of the OS
# app-data directory, for the no-install Windows distribution.
portable = []

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "time", "sync"] }
chrono = "0.4"
jar-core = { path = "../../crates/jar-core" }
jar-protocol = { path = "../../crates/jar-protocol" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
