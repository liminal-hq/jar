version: 2
updates:
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Dormant while the aquarium/theming PR stack is landing (matches the
    # org's own default) — bump this back to 5 once that stack is merged.
    open-pull-requests-limit: 0
    labels:
      - 'build'
    groups:
      tauri:
        patterns:
          - 'tauri*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'build'
    groups:
      tauri:
        patterns:
          - '@tauri-apps/*'
          - 'tauri-plugin-*'
      react-three:
        patterns:
          - 'three'
          - '@types/three'
          - '@react-three/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'ci'
