name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (defaults to `v` plus the synchronised workspace version)
        required: false
        type: string
      release_draft:
        description: Create or keep this release as a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag || github.sha) || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      release_target: ${{ steps.meta.outputs.release_target }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_url: ${{ steps.release.outputs.release_url }}
      release_action: ${{ steps.release.outputs.release_action }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          MANUAL_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          git fetch origin main
          git fetch --tags origin

          CHECKOUT_REF="${GITHUB_SHA}"
          RELEASE_TARGET="${GITHUB_SHA}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_RELEASE_TAG}" ]]; then
            TAG_NAME="${MANUAL_RELEASE_TAG}"
            if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: ${TAG_NAME}" >&2
              echo "Expected a tag matching vX.Y.Z or vX.Y.Z-beta.N" >&2
              exit 1
            fi

            CHECKOUT_REF="${TAG_NAME}"
            RELEASE_TARGET="$(git rev-list -n 1 "${TAG_NAME}")"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: ${TAG_NAME}" >&2
              echo "Expected a tag matching vX.Y.Z or vX.Y.Z-beta.N" >&2
              exit 1
            fi
          else
            RELEASE_VERSION="$(bash ./scripts/check-release-versions.sh --current-version)"
            TAG_NAME="v${RELEASE_VERSION}"

            if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              CHECKOUT_REF="${TAG_NAME}"
              RELEASE_TARGET="$(git rev-list -n 1 "${TAG_NAME}")"
            fi
          fi

          if ! git merge-base --is-ancestor "${RELEASE_TARGET}" "origin/main"; then
            echo "Release commit is not on origin/main: ${RELEASE_TARGET}" >&2
            exit 1
          fi

          git checkout --quiet "${CHECKOUT_REF}"

          RELEASE_VERSION="$(bash ./scripts/check-release-versions.sh --current-version)"

          if [[ "${TAG_NAME#v}" != "${RELEASE_VERSION}" ]]; then
            echo "Release tag ${TAG_NAME} does not match the synchronised manifest version ${RELEASE_VERSION}" >&2
            exit 1
          fi

          PRERELEASE=false
          if [[ "${TAG_NAME}" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${CHECKOUT_REF}" >> "${GITHUB_OUTPUT}"
          echo "release_target=${RELEASE_TARGET}" >> "${GITHUB_OUTPUT}"
          echo "release_name=Jar ${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_TARGET: ${{ steps.meta.outputs.release_target }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft || false }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          RELEASE_MATCH="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | [.id, .html_url] | @tsv" \
              | head -n 1 || true
          )"

          if [[ -z "${RELEASE_MATCH}" ]]; then
            RELEASE_JSON="$(
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="${TAG_NAME}" \
                -f target_commitish="${RELEASE_TARGET}" \
                -f name="${RELEASE_NAME}" \
                -f body='See assets below to download and install.' \
                -F generate_release_notes=true \
                -F draft="${RELEASE_DRAFT}" \
                -F prerelease="${RELEASE_PRERELEASE}"
            )"
            RELEASE_ID="$(printf '%s' "${RELEASE_JSON}" | jq -r '.id')"
            RELEASE_URL="$(printf '%s' "${RELEASE_JSON}" | jq -r '.html_url')"
            RELEASE_ACTION="created"
          else
            RELEASE_ID="$(awk '{print $1}' <<< "${RELEASE_MATCH}")"
            RELEASE_URL="$(awk '{print $2}' <<< "${RELEASE_MATCH}")"

            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f name="${RELEASE_NAME}" \
              -F draft="${RELEASE_DRAFT}" \
              -F prerelease="${RELEASE_PRERELEASE}" \
              >/dev/null

            RELEASE_ACTION="reused"
          fi

          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
          echo "release_url=${RELEASE_URL}" >> "${GITHUB_OUTPUT}"
          echo "release_action=${RELEASE_ACTION}" >> "${GITHUB_OUTPUT}"

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Jar Release Summary"
            echo
            echo "- Resolved version: \`${{ steps.meta.outputs.release_version || 'unavailable' }}\`"
            echo "- Release tag: \`${{ steps.meta.outputs.tag_name || 'unavailable' }}\`"
            echo "- Checkout ref: \`${{ steps.meta.outputs.checkout_ref || 'unavailable' }}\`"
            echo "- Release target: \`${{ steps.meta.outputs.release_target || 'unavailable' }}\`"
            echo "- Release name: \`${{ steps.meta.outputs.release_name || 'unavailable' }}\`"
            echo "- Release action: \`${{ steps.release.outputs.release_action || 'unavailable' }}\`"
            echo "- Draft: \`${{ github.event_name == 'workflow_dispatch' && inputs.release_draft || false }}\`"
            echo "- Prerelease: \`${{ steps.meta.outputs.prerelease || 'unavailable' }}\`"
            echo "- Release URL: ${{ steps.release.outputs.release_url || 'unavailable' }}"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  build-linux:
    name: Linux (${{ matrix.arch }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            artefact_name: linux-release-assets-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            artefact_name: linux-release-assets-arm64
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - name: Trust the GitHub workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - name: Check release version synchronisation
        run: bun run release:version:check

      - name: Build Linux release bundles
        run: bun run tauri build --bundles deb,rpm

      - name: Collect release assets
        run: |
          set -euo pipefail

          release_dir="release-assets/linux"
          mkdir -p "${release_dir}"

          mapfile -t bundle_files < <(find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' \) | sort)
          if [[ "${#bundle_files[@]}" -eq 0 ]]; then
            echo "No Linux release artefacts found under target/release/bundle" >&2
            exit 1
          fi

          for file in "${bundle_files[@]}"; do
            cp "${file}" "${release_dir}/"
          done

      - name: Upload staged release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefact_name }}
          path: release-assets/linux/**
          if-no-files-found: error

  package-appimage:
    name: AppImage (${{ matrix.arch }})
    needs:
      - prepare-release
      - build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            deb-artifact: linux-release-assets-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            deb-artifact: linux-release-assets-arm64
    uses: liminal-hq/.github/.github/workflows/package-arch-appimage.yml@main
    with:
      runs-on: ${{ matrix.runner }}
      deb-artifact-name: ${{ matrix.deb-artifact }}
      app-version: ${{ needs.prepare-release.outputs.release_version }}
    secrets: inherit

  build-windows:
    name: Windows (${{ matrix.arch }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            artefact_name: windows-release-assets-x64
          - runner: windows-11-arm
            arch: arm64
            artefact_name: windows-release-assets-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - name: Check release version synchronisation
        run: bun run release:version:check

      - name: Build Windows release bundles
        run: bun run tauri build --bundles msi,nsis

      - name: Collect release assets
        run: |
          set -euo pipefail

          release_dir="release-assets/windows"
          mkdir -p "${release_dir}"

          mapfile -t bundle_files < <(find target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' \) | sort)
          if [[ "${#bundle_files[@]}" -eq 0 ]]; then
            echo "No Windows release artefacts found under target/release/bundle" >&2
            exit 1
          fi

          for file in "${bundle_files[@]}"; do
            cp "${file}" "${release_dir}/"
          done

      - name: Upload staged release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefact_name }}
          path: release-assets/windows/**
          if-no-files-found: error

  # Sibling of build-windows, not chained after it (needs: prepare-release
  # only) so both run in parallel. No installer: jar.exe and
  # WebView2Loader.dll go into a zip as-is, and the portable Cargo feature
  # (see plugins/tauri-plugin-jar) makes the app store its snapshot beside
  # itself instead of the OS app-data directory.
  build-windows-portable:
    name: Windows portable (${{ matrix.arch }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            artefact_name: windows-release-assets-x64-portable
          - runner: windows-11-arm
            arch: arm64
            artefact_name: windows-release-assets-arm64-portable
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - name: Check release version synchronisation
        run: bun run release:version:check

      - name: Build portable Windows binary
        run: bun run tauri build --no-bundle --features portable

      - name: Package portable zip
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          release_dir="release-assets/windows-portable"
          mkdir -p "${release_dir}"

          exe="target/release/jar.exe"
          if [[ ! -f "${exe}" ]]; then
            echo "Expected build output not found: ${exe}" >&2
            exit 1
          fi

          # webview2-com-sys's build script copies WebView2Loader.dll into
          # its own OUT_DIR/<arch>/, never into target/release/ directly --
          # that only happens as a side effect of NSIS/WiX bundling, which
          # --no-bundle skips entirely.
          mapfile -t dll_matches < <(find target/release/build -path "*/webview2-com-sys-*/out/${ARCH}/WebView2Loader.dll")
          if [[ "${#dll_matches[@]}" -ne 1 ]]; then
            echo "Expected exactly one WebView2Loader.dll under target/release/build/webview2-com-sys-*/out/${ARCH}/, found ${#dll_matches[@]}" >&2
            exit 1
          fi
          dll="${dll_matches[0]}"

          # Stage as flat filenames before zipping -- 7z stores files under
          # whatever path is given on the command line, and both source
          # paths above are several directories deep.
          release_dir_abs="$(pwd)/${release_dir}"
          staging_dir="$(mktemp -d)"
          cp "${exe}" "${staging_dir}/jar.exe"
          cp "${dll}" "${staging_dir}/WebView2Loader.dll"

          zip_name="Jar_${RELEASE_VERSION}_${ARCH}-portable.zip"
          (cd "${staging_dir}" && 7z a "${release_dir_abs}/${zip_name}" jar.exe WebView2Loader.dll)

      - name: Upload staged release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefact_name }}
          path: release-assets/windows-portable/**
          if-no-files-found: error

  build-macos:
    name: macOS (universal)
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - name: Check release version synchronisation
        run: bun run release:version:check

      - name: Build macOS universal bundle
        run: bun run tauri build --target universal-apple-darwin --bundles dmg

      - name: Collect release assets
        run: |
          set -euo pipefail

          release_dir="release-assets/macos"
          mkdir -p "${release_dir}"

          # macOS runners default to Apple's stock /bin/bash (3.2, frozen
          # for licensing reasons), which lacks the `mapfile`/`readarray`
          # builtin -- collect into the array via a plain read loop instead,
          # which works back to bash 3.2. `read -r file` (a single target
          # variable) captures each whole line -- including any spaces --
          # so this stays filename-safe without needing `find -print0` /
          # `sort -z`, which aren't reliably available under macOS's BSD
          # coreutils.
          bundle_files=()
          while IFS= read -r file; do
            bundle_files+=("${file}")
          done < <(find target/universal-apple-darwin/release/bundle -type f -name '*.dmg' | sort)
          if [[ "${#bundle_files[@]}" -eq 0 ]]; then
            echo "No macOS release artefacts found under target/universal-apple-darwin/release/bundle" >&2
            exit 1
          fi

          for file in "${bundle_files[@]}"; do
            cp "${file}" "${release_dir}/"
          done

      - name: Upload staged release assets
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-assets-universal
          path: release-assets/macos/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    needs:
      - prepare-release
      - build-linux
      - package-appimage
      - build-windows
      - build-windows-portable
      - build-macos
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux release assets
        uses: actions/download-artifact@v7
        with:
          pattern: linux-release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Download AppImage assets
        uses: actions/download-artifact@v7
        with:
          pattern: appimage-*
          path: release-assets
          merge-multiple: true

      - name: Download Windows release assets
        uses: actions/download-artifact@v7
        with:
          pattern: windows-release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Download macOS release assets
        uses: actions/download-artifact@v7
        with:
          pattern: macos-release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Tag each asset with its OS
        run: |
          set -euo pipefail
          cd release-assets

          declare -A os_by_ext=(
            [deb]=Linux
            [rpm]=Linux
            [AppImage]=Linux
            [exe]=Win
            [msi]=Win
            [zip]=Win
            [dmg]=Mac
          )

          for file in *; do
            ext="${file##*.}"
            os="${os_by_ext[$ext]:-}"
            if [[ -z "${os}" ]]; then
              echo "No OS mapping for '${file}' (extension '${ext}') -- leaving as-is" >&2
              continue
            fi
            if [[ "${file}" =~ ^Jar([_-])(.*)$ ]]; then
              sep="${BASH_REMATCH[1]}"
              rest="${BASH_REMATCH[2]}"
              mv "${file}" "Jar${sep}${os}${sep}${rest}"
            else
              echo "'${file}' doesn't start with Jar<separator> -- leaving as-is" >&2
            fi
          done

      - name: Compute checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* | sed 's# \./#  #' > SHA256SUMS

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" release-assets/* --clobber
