name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run test:js:ci
      - run: bun run build

      - name: Upload frontend test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: test-results/junit.xml
          if-no-files-found: error

      # Consumed by publish-test-results.yml — the pull_request event's own
      # GITHUB_TOKEN is read-only for Dependabot and fork PRs, so publishing
      # the JUnit check run has to happen from a separate `workflow_run`
      # workflow instead, which runs with this repo's own permissions
      # regardless of who opened the PR.
      - name: Upload event file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

  rust-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Trust the GitHub workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --profile ci

      - name: Upload Rust test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

  protocol-bindings-drift:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Trust the GitHub workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: Swatinem/rust-cache@v2

      - name: Snapshot committed generated files
        run: cp -r apps/jar/src/domain/protocol/generated /tmp/generated-before

      - name: Regenerate protocol bindings and fixtures
        run: cargo test -p jar-protocol

      - name: Check for uncommitted drift
        run: diff -rq /tmp/generated-before apps/jar/src/domain/protocol/generated
