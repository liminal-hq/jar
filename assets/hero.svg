<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Jar</title>
  <desc id="hero-desc">A tiny simulation in a box. A dark-themed banner with a glass jar, a couple of fish, and rising bubbles.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020608"/>
      <stop offset="100%" stop-color="#081824"/>
    </linearGradient>

    <!-- A "water depth" gradient instead of the house orange/pink/purple
         brand colours: mint at the surface, aquarium blue mid-depth, deep
         indigo at the bottom of the jar. -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fe7c4"/>
      <stop offset="50%" stop-color="#3ba7e0"/>
      <stop offset="100%" stop-color="#7c6cf0"/>
    </linearGradient>

    <linearGradient id="jar-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c6cf0" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#3ba7e0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6fe7c4" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ba7e0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3ba7e0" stop-opacity="0.10"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="jar-body" d="M900,80 C900,80 875,94 868,132 L868,262 C868,288 892,304 955,304 C1018,304 1042,288 1042,262 L1042,132 C1035,94 1010,80 1010,80 Z"/>
    <clipPath id="jar-clip">
      <use href="#jar-body"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <g opacity="0.08">
    <circle cx="950" cy="160" r="200" fill="#7c6cf0"/>
    <circle cx="200" cy="80" r="150" fill="#2ec6a0"/>
    <circle cx="600" cy="260" r="160" fill="#3ba7e0"/>
  </g>

  <g opacity="0.04" stroke="#3ba7e0" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Jar: lid, neck, and glass body -->
  <g>
    <rect x="925" y="56" width="60" height="14" rx="5" fill="#2e3540"/>
    <rect x="918" y="66" width="74" height="10" rx="4" fill="#3a3f4a"/>
    <use href="#jar-body" fill="url(#jar-glass)" stroke="#2e3540" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- Water, sand, plant, fish and bubbles, clipped to the jar's silhouette -->
  <g clip-path="url(#jar-clip)">
    <rect x="860" y="150" width="190" height="160" fill="url(#water)"/>
    <line x1="868" y1="150" x2="1042" y2="150" stroke="#3ba7e0" stroke-width="1" opacity="0.5"/>

    <ellipse cx="955" cy="300" rx="75" ry="10" fill="#b89666" opacity="0.3"/>
    <path d="M905,300 C902,282 912,268 908,252 C918,268 916,286 912,300 Z" fill="#2ec66a" opacity="0.35"/>
    <path d="M918,300 C916,278 928,262 924,246 C936,264 932,284 926,300 Z" fill="#2ec66a" opacity="0.3"/>

    <!-- Wandering fish -->
    <g fill="#3ba7e0" opacity="0.85">
      <g transform="translate(955,210)">
        <ellipse rx="14" ry="7"/>
        <path d="M-13,0 L-22,-7 L-22,7 Z"/>
        <animateMotion dur="9s" repeatCount="indefinite"
          path="M-50,0 C -20,-28 20,28 50,0 C 20,-28 -20,28 -50,0"/>
      </g>
      <g transform="translate(940,250)" fill="#ffaa40" opacity="0.75">
        <ellipse rx="10" ry="5"/>
        <path d="M-9,0 L-16,-5 L-16,5 Z"/>
        <animateMotion dur="12s" repeatCount="indefinite"
          path="M30,0 C 10,18 -30,-14 -45,4 C -25,-10 15,16 30,0"/>
      </g>
    </g>

    <!-- Rising bubbles -->
    <g fill="#dff1ff">
      <circle cx="930" cy="295" r="3" opacity="0.7">
        <animateMotion dur="4s" repeatCount="indefinite" path="M0,0 L0,-220"/>
        <animate attributeName="opacity" values="0.7;0.7;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="955" cy="298" r="2.5" opacity="0.6">
        <animateMotion dur="5s" begin="0.8s" repeatCount="indefinite" path="M0,0 L0,-225"/>
        <animate attributeName="opacity" values="0.6;0.6;0" dur="5s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="945" cy="296" r="2" opacity="0.5">
        <animateMotion dur="3.4s" begin="1.6s" repeatCount="indefinite" path="M0,0 L0,-218"/>
        <animate attributeName="opacity" values="0.5;0.5;0" dur="3.4s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="968" cy="297" r="3.5" opacity="0.65">
        <animateMotion dur="5.6s" begin="2.4s" repeatCount="indefinite" path="M0,0 L0,-222"/>
        <animate attributeName="opacity" values="0.65;0.65;0" dur="5.6s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="938" cy="299" r="2.2" opacity="0.55">
        <animateMotion dur="4.6s" begin="3.2s" repeatCount="indefinite" path="M0,0 L0,-224"/>
        <animate attributeName="opacity" values="0.55;0.55;0" dur="4.6s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="962" cy="296" r="2.8" opacity="0.6">
        <animateMotion dur="3.9s" begin="0.3s" repeatCount="indefinite" path="M0,0 L0,-219"/>
        <animate attributeName="opacity" values="0.6;0.6;0" dur="3.9s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Title -->
  <text x="80" y="150" font-size="72" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" letter-spacing="-0.02em" fill="url(#brand)" filter="url(#text-glow)">Jar</text>

  <!-- Tagline -->
  <text x="83" y="182" fill="#b4bfce" font-size="18" font-family="'Inter', system-ui, sans-serif">A tiny simulation in a box</text>

  <!-- Tech badge -->
  <g transform="translate(920,42)" filter="url(#glow)">
    <rect width="220" height="38" rx="10" fill="#0f1520" stroke="#2e3540" stroke-width="1"/>
    <text x="16" y="25" font-size="14" font-family="monospace">
      <tspan fill="#7c8796">tauri</tspan><tspan fill="#2e3540"> + </tspan><tspan fill="#ffaa40">rust</tspan><tspan fill="#2e3540"> + </tspan><tspan fill="#3ba7e0">react</tspan>
    </text>
  </g>

  <!-- Bottom info line -->
  <text x="80" y="290" fill="#7c8796" font-size="13" font-family="monospace">
    <tspan fill="#9aa4b2">aging</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">breeding</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">genetics</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">passing</tspan>
    <tspan fill="#2e3540">  &#x2022;  </tspan>
    <tspan fill="#7c8796">Liminal HQ</tspan>
  </text>
</svg>
