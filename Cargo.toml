[workspace]
members = [
    "apps/jar/src-tauri",
    "crates/jar-core",
    "crates/jar-protocol",
    "plugins/tauri-plugin-jar",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Liminal HQ, Scott Morris"]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/liminal-hq/jar"
repository = "https://github.com/liminal-hq/jar"

[workspace.dependencies]
serde     = { version = "1", features = ["derive"] }
postcard  = { version = "1", features = ["alloc"] }
thiserror = "1"
ts-rs     = "12"
rand      = "0.8"
tauri     = { version = "2" }

[profile.release]
strip = true
